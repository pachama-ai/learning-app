#
# Die Lernkartei über Apache, als virtueller Host des System-Apache.
#
# Das ist die Datei für /etc/apache2/sites-available. Sie ist nicht von selbst aktiv:
# jemand mit sudo muss sie kopieren, einschalten und Apache neu laden - siehe die
# Befehle in start-apache.sh, Abschnitt "Der Systemweg".
#
# Warum überhaupt Apache: der Entwicklungsserver von PHP antwortet mit einem Arbeiter je
# Anfrage, die vier Anfragen einer Unterkategorieseite stellen sich also hintereinander
# an. Apache beantwortet sie nebeneinander.
#
# Der DocumentRoot ist public/ und sonst nichts, genau wie es die Regeln des Projekts
# sagen: src/ (mit den Zugangsdaten der Datenbank) liegt außerhalb des Web-Verzeichnisses
# und kann nie über HTTP geholt werden.
#
<VirtualHost *:80>
    ServerName learning-app.local
    ServerAlias localhost

    DocumentRoot /home/user/projects/learning-app/public

    <Directory /home/user/projects/learning-app/public>
        Options -Indexes -Includes
        AllowOverride None
        Require all granted
    </Directory>

    DirectoryIndex index.php

    #
    # Zweite Sicherung für die Zugangsdaten: .env liegt im Projektstamm, also
    # außerhalb des DocumentRoot und ist damit ohnehin nicht erreichbar. Dieser
    # Block verbietet den Projektstamm zusätzlich, falls der DocumentRoot
    # einmal versehentlich höher gesetzt wird. Der speziellere Block für
    # public/ oben hebt das Verbot für die ausgelieferten Dateien wieder auf.
    #
    <Directory /home/user/projects/learning-app>
        Require all denied
    </Directory>

    #
    # Die Zeichnungen in categories.icon_svg sind SVG = Text, und das sind HTML, CSS,
    # JavaScript und JSON auch. Gzip macht daraus einen Bruchteil ihrer Größe.
    #
    AddOutputFilterByType DEFLATE image/svg+xml text/html text/css application/javascript application/json

    <IfModule mod_deflate.c>
        DeflateCompressionLevel 6
    </IfModule>

    #
    # Der System-Apache läuft als www-data und darf nicht in /var/lib/php/sessions
    # schreiben, das der Kommandozeile gehört. Der Anmeldezustand ist eine PHP-Sitzung,
    # der Ordner muss also einer sein, in den er schreiben darf.
    #
    php_value session.save_path /home/user/projects/learning-app/deploy/apache/sessions
    php_flag display_errors off

    #
    # Fehler gehören ins Protokoll des Projekts, nie in die Seite.
    #
    php_value error_log /home/user/projects/learning-app/deploy/apache/logs/php-error.log
</VirtualHost>
