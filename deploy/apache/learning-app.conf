#
# The learning app through Apache, as a virtual host of the system Apache.
#
# This is the file for /etc/apache2/sites-available. It is NOT active by itself:
# somebody with sudo has to copy it, enable it and reload Apache - see the
# commands in start-apache.sh (section "the system way").
#
# Why Apache at all: the development server of PHP answers with one worker per
# request, so the four requests a subcategory page makes at the same time queue
# up behind each other. Apache answers them side by side.
#
# DocumentRoot is public/ and nothing else, exactly like the project rules say:
# src/ (with the database credentials) is outside the web root and can never be
# fetched over HTTP.
#
<VirtualHost *:80>
    ServerName learning-app.local
    ServerAlias localhost

    DocumentRoot /home/user/projects/learning-app/public

    <Directory /home/user/projects/learning-app/public>
        Options -Indexes -Includes
        AllowOverride None
        Require all granted
    </Directory>

    DirectoryIndex index.php

    #
    # The drawings in categories.icon_svg are SVG = text, and so are HTML, CSS,
    # JavaScript and JSON. Gzip makes them a fraction of their size.
    #
    AddOutputFilterByType DEFLATE image/svg+xml text/html text/css application/javascript application/json

    <IfModule mod_deflate.c>
        DeflateCompressionLevel 6
    </IfModule>

    #
    # The system Apache runs as www-data, which may not write into
    # /var/lib/php/sessions of the CLI. The log-in state is a PHP session, so the
    # folder has to be one it can write to.
    #
    php_value session.save_path /home/user/projects/learning-app/deploy/apache/sessions
    php_flag display_errors off

    #
    # Errors belong in the log of the project, never into the page.
    #
    php_value error_log /home/user/projects/learning-app/deploy/apache/logs/php-error.log
</VirtualHost>
