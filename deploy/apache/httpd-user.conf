#
# Die Lernkartei über Apache - als eigene Instanz, gestartet von dem Benutzer, dem das
# Projekt gehört, auf einem hohen Port (voreingestellt 8082).
#
# Warum so: es braucht KEIN sudo, es rührt nichts vom System-Apache an (der weiter
# /var/www/html auf Port 80 ausliefert), und es lässt sich starten und beenden wie der
# Entwicklungsserver von PHP, den es ersetzt. Derselbe Server, dasselbe PHP-Modul,
# dieselbe Kompression - nur der Prozess und der Port gehören uns.
#
# Starten mit ./start-apache.sh (dieses Skript richtet die Pfade ein).
#
ServerRoot "/etc/apache2"
# Nur auf der lokalen Adresse, wie der Entwicklungsserver: so erreicht
# der Browser unter Windows die Adresse 127.0.0.1:8082 ohne Umwege.
Listen 127.0.0.1:8082

ServerName localhost
PidFile "/home/user/projects/learning-app/deploy/apache/logs/apache.pid"
ErrorLog "/home/user/projects/learning-app/deploy/apache/logs/error.log"
LogLevel warn
CustomLog "/home/user/projects/learning-app/deploy/apache/logs/access.log" combined

#
# Die Module dieser Maschine, genau so, wie der System-Apache sie lädt: mpm_prefork
# (das braucht das PHP-Modul), mod_php, mod_deflate und der Rest.
#
Include /etc/apache2/mods-enabled/*.load
Include /etc/apache2/mods-enabled/*.conf
Include /etc/apache2/mods-enabled/dir.conf
Include /etc/apache2/mods-enabled/alias.conf
Include /etc/apache2/mods-enabled/mpm_prefork.conf

DocumentRoot "/home/user/projects/learning-app/public"

<Directory "/home/user/projects/learning-app/public">
    Options -Indexes -Includes
    AllowOverride None
    Require all granted
</Directory>

DirectoryIndex index.php

#
# Zweite Sicherung für die Zugangsdaten: .env liegt im Projektstamm, also
# außerhalb des DocumentRoot und ist damit ohnehin nicht erreichbar. Dieser
# Block verbietet den Projektstamm zusätzlich, falls der DocumentRoot einmal
# versehentlich höher gesetzt wird. Der speziellere Block für public/ oben
# hebt das Verbot für die ausgelieferten Dateien wieder auf.
#
<Directory "/home/user/projects/learning-app">
    Require all denied
</Directory>

#
# Text bleibt Text: SVG-Zeichnungen, HTML, CSS, JavaScript und JSON reisen gezippt.
#
AddOutputFilterByType DEFLATE image/svg+xml text/html text/css application/javascript application/json

<IfModule deflate_module>
    DeflateCompressionLevel 6
</IfModule>

<Directory "/home/user/projects/learning-app/public">
    #
    # Diese Instanz läuft als der Benutzer, dem das Projekt gehört, die Sitzungen des
    # Anmeldezustands müssen also dort liegen, wo dieser Benutzer schreiben darf.
    #
    php_value session.save_path /home/user/projects/learning-app/deploy/apache/sessions
    php_flag display_errors off
    php_value error_log /home/user/projects/learning-app/deploy/apache/logs/php-error.log
</Directory>
